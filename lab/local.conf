#
# DevStack config for the neutron-appliance lab.
#
# Based on neutron/devstack/ovn-local.conf.sample (ML2/OVN, all-in-one) and
# trimmed for speed. The appliance driver itself is configured afterwards by
# lab/setup.sh, not here, so that it can be re-run without re-stacking.

[[local|localrc]]

DATABASE_PASSWORD=password
RABBIT_PASSWORD=password
SERVICE_PASSWORD=password
SERVICE_TOKEN=password
ADMIN_PASSWORD=password

# ---------------------------------------------------------------- ML2/OVN ---
Q_AGENT=ovn
Q_ML2_PLUGIN_MECHANISM_DRIVERS=ovn
Q_ML2_PLUGIN_TYPE_DRIVERS=local,flat,vlan,geneve
Q_ML2_TENANT_NETWORK_TYPE="geneve"

enable_service ovn-northd
enable_service ovn-controller
enable_service q-ovn-agent
enable_service q-svc

# Agents not used with OVN.
disable_service q-agt
disable_service q-l3
disable_service q-dhcp
disable_service q-meta

enable_plugin neutron https://opendev.org/openstack/neutron
enable_service q-trunk
enable_service q-dns
enable_service q-port-forwarding
enable_service q-qos

# Host gateway routers here (single node).
ENABLE_CHASSIS_AS_GW=True

# ------------------------------------------------------------------- trim ---
# Not needed here; each one costs install time and RAM.
disable_service horizon
disable_service tempest
disable_service cinder c-sch c-api c-vol
disable_service swift
disable_service dstat

LOGFILE=$DEST/logs/stack.sh.log
VERBOSE=True
LOG_COLOR=False
RECLONE=False

# Keep the guest images small: cirros only.
DOWNLOAD_DEFAULT_IMAGES=True

# NOTE: DO NOT MOVE THE post-config SECTIONS FROM THE END OF THIS FILE.

[[post-config|$NOVA_CONF]]
[scheduler]
discover_hosts_in_cells_interval = 2
